name: order-service
type: Backend Service

image:
  build: services/order-service/Dockerfile
  port: 8084

cpu: 256
memory: 512
count: 1
exec: true

variables:
  SERVER_PORT: 8084
  INVENTORY_SERVICE_URL: http://inventory-service:8083
  PAYMENT_SERVICE_URL: http://payment-service:8085

secrets:
  DB_PASSWORD:
    from_cfn: omnichannel-dev-DBSecretArn:password
