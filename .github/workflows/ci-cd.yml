name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy_to_aws:
        description: 'Attempt deployment to AWS (requires AWS_ROLE_TO_ASSUME secret)'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'omnichannel-dev' }}

jobs:
  # ===========================================================================
  # Job 1: Automated Test Matrix across all 7 microservices
  # ===========================================================================
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x services/${{ matrix.service }}/gradlew

      - name: Build container dependencies for Order Integration Tests
        if: matrix.service == 'order-service'
        run: |
          chmod +x services/inventory-service/gradlew services/payment-service/gradlew
          ./services/inventory-service/gradlew -p services/inventory-service bootJar -x test --no-daemon
          docker build -t inventory-service:test -f services/inventory-service/Dockerfile services/inventory-service
          ./services/payment-service/gradlew -p services/payment-service bootJar -x test --no-daemon
          docker build -t payment-service:test -f services/payment-service/Dockerfile services/payment-service

      - name: Run Unit & Integration Tests
        run: ./services/${{ matrix.service }}/gradlew -p services/${{ matrix.service }} test --no-daemon

      - name: Archive Test Results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/test/
          retention-days: 7

  # ===========================================================================
  # Job 2: Build Spring Boot Executables & Validate Container Packaging
  # ===========================================================================
  build-and-package:
    name: Build & Package (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x services/${{ matrix.service }}/gradlew

      - name: Build Spring Boot Executable JAR
        run: ./services/${{ matrix.service }}/gradlew -p services/${{ matrix.service }} bootJar -x test --no-daemon

      - name: Build Local Docker Image
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            -t ${{ matrix.service }}:latest \
            -f services/${{ matrix.service }}/Dockerfile \
            services/${{ matrix.service }}

      - name: Verify Docker Image
        run: docker images ${{ matrix.service }}

  # ===========================================================================
  # Job 3: AWS Deployment (ECR Registry & Container Deployment)
  # ===========================================================================
  deploy-aws:
    name: Deploy to AWS
    needs: [test, build-and-package]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check AWS Configuration Status
        id: check-aws
        run: |
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "aws_configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=AWS Deployment Paused::AWS_ROLE_TO_ASSUME secret is not configured in this repository. CI tests and Docker builds completed successfully! To activate AWS deployment, follow instructions in docs/AWS_CICD_SETUP.md."
          else
            echo "aws_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.check-aws.outputs.aws_configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        if: steps.check-aws.outputs.aws_configured == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 21 for release build
        if: steps.check-aws.outputs.aws_configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build and Push Docker Images to Amazon ECR
        if: steps.check-aws.outputs.aws_configured == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SERVICES=("api-gateway" "auth-service" "product-service" "inventory-service" "order-service" "payment-service" "notification-service")
          for svc in "${SERVICES[@]}"; do
            echo "==========================================="
            echo "Building and Pushing: $svc"
            echo "==========================================="
            chmod +x services/$svc/gradlew
            ./services/$svc/gradlew -p services/$svc bootJar -x test --no-daemon
            
            docker build \
              -t $ECR_REGISTRY/$svc:$IMAGE_TAG \
              -t $ECR_REGISTRY/$svc:latest \
              -f services/$svc/Dockerfile \
              services/$svc

            docker push $ECR_REGISTRY/$svc:$IMAGE_TAG
            docker push $ECR_REGISTRY/$svc:latest
          done

      - name: Check Amazon ECS Cluster Status
        if: steps.check-aws.outputs.aws_configured == 'true'
        id: check-ecs
        run: |
          CLUSTER_NAME="${{ env.ECS_CLUSTER }}"
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          if aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query "clusters[?status=='ACTIVE'].clusterName" --output text | grep -q "$CLUSTER_NAME"; then
            echo "ecs_active=true" >> $GITHUB_OUTPUT
            echo "ECS Cluster '$CLUSTER_NAME' is active. Proceeding with service rolling updates."
          else
            echo "ecs_active=false" >> $GITHUB_OUTPUT
            echo "::notice title=ECS Rolling Deployment Paused::ECS cluster '$CLUSTER_NAME' was not found or is inactive. Container images were successfully pushed to Amazon ECR. Deploy your cluster using AWS Copilot (docs/AWS_COPILOT_ECS_DEPLOYMENT.md) to enable automatic rolling updates."
          fi

      - name: Render API Gateway Task Definition
        if: steps.check-aws.outputs.aws_configured == 'true' && steps.check-ecs.outputs.ecs_active == 'true'
        id: render-api-gateway
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infrastructure/ecs/task-definitions/api-gateway.json
          container-name: api-gateway
          image: ${{ steps.login-ecr.outputs.registry }}/api-gateway:${{ github.sha }}

      - name: Deploy API Gateway to Amazon ECS
        if: steps.check-aws.outputs.aws_configured == 'true' && steps.check-ecs.outputs.ecs_active == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api-gateway.outputs.task-definition }}
          service: api-gateway
          cluster: ${{ steps.check-ecs.outputs.cluster_name }}
          wait-for-service-stability: false

      - name: Deploy Backend Services to Amazon ECS
        if: steps.check-aws.outputs.aws_configured == 'true' && steps.check-ecs.outputs.ecs_active == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          CLUSTER: ${{ steps.check-ecs.outputs.cluster_name }}
        run: |
          BACKEND_SERVICES=("auth-service" "product-service" "inventory-service" "order-service" "payment-service" "notification-service")
          for svc in "${BACKEND_SERVICES[@]}"; do
            echo "==============================================="
            echo "Deploying Backend Service: $svc"
            echo "==============================================="
            sed -e "s|<IMAGE1_NAME>|$ECR_REGISTRY/$svc:$IMAGE_TAG|g" \
                infrastructure/ecs/task-definitions/$svc.json > /tmp/$svc-rendered.json

            NEW_TASK_DEF=$(aws ecs register-task-definition --cli-input-json file:///tmp/$svc-rendered.json --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "Registered task definition: $NEW_TASK_DEF"

            if aws ecs describe-services --cluster "$CLUSTER" --services "$svc" --query "services[?status=='ACTIVE'].serviceName" --output text | grep -q "$svc"; then
              aws ecs update-service --cluster "$CLUSTER" --service "$svc" --task-definition "$NEW_TASK_DEF" --force-new-deployment
              echo "Dispatched rolling update for service: $svc"
            else
              echo "Service $svc not currently active in cluster $CLUSTER. Skipping service update."
            fi
          done

      - name: Generate CI/CD Summary
        run: |
          echo "### CI/CD Pipeline Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Matrix:** ✅ Passed across all 7 microservices" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Builds:** ✅ Validated across all 7 microservices" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-aws.outputs.aws_configured }}" = "true" ]; then
            echo "- **Amazon ECR:** ✅ Images pushed to registry in \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.check-ecs.outputs.ecs_active }}" = "true" ]; then
              echo "- **Amazon ECS Deployment:** 🚀 Rolling deployment dispatched to cluster \`${{ steps.check-ecs.outputs.cluster_name }}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **Amazon ECS Deployment:** ⏸️ Cluster not active. Provision via AWS Copilot to enable live updates." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **AWS Deployment:** ⏸️ Skipped (awaiting \`AWS_ROLE_TO_ASSUME\` secret)" >> $GITHUB_STEP_SUMMARY
            echo "- **Setup Documentation:** Refer to \`docs/AWS_CICD_SETUP.md\` to connect your AWS Account via OIDC." >> $GITHUB_STEP_SUMMARY
          fi
