services:

  postgres:
    image: postgres:17
    container_name: omnichannel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: omnichannel

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d omnichannel"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    container_name: omnichannel-kafka
    restart: unless-stopped

    ports:
      - "9094:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  inventory-service:
    build: services/inventory-service
    image: inventory-service:test
    container_name: inventory-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      SERVER_PORT: 8083

    ports:
      - "8083:8083"

    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: services/payment-service
    image: payment-service:test
    container_name: payment-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8085

    ports:
      - "8085:8085"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  order-service:
    build: services/order-service
    image: order-service:test
    container_name: order-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password

      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SERVER_PORT: 8084

    ports:
      - "8084:8084"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started

  notification-service:
    build: services/notification-service
    image: notification-service:test
    container_name: notification-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8086

    ports:
      - "8086:8086"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  auth-service:
    build: services/auth-service
    image: auth-service:test
    container_name: auth-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      SERVER_PORT: 8081

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: services/product-service
    image: product-service:test
    container_name: product-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      SERVER_PORT: 8082

    ports:
      - "8082:8082"

    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: services/api-gateway
    image: api-gateway:test
    container_name: api-gateway
    restart: unless-stopped

    environment:
      ORDER_SERVICE_URL: http://order-service:8084
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      AUTH_SERVICE_URL: http://auth-service:8081
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    depends_on:
      - order-service
      - payment-service
      - inventory-service
      - product-service
      - auth-service
      - notification-service

volumes:
  postgres_data: