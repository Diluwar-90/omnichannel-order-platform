services:

  postgres:
    image: postgres:17
    container_name: omnichannel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: omnichannel

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d omnichannel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: