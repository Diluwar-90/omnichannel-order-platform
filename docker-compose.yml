services:

  postgres:
    image: postgres:17
    container_name: omnichannel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: omnichannel

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d omnichannel"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-service:
    image: inventory-service:test
    container_name: inventory-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      SERVER_PORT: 8083

    ports:
      - "8083:8083"

    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    image: payment-service:test
    container_name: payment-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      SERVER_PORT: 8085

    ports:
      - "8085:8085"

    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    image: order-service:test
    container_name: order-service
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password

      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085

      SERVER_PORT: 8084

    ports:
      - "8084:8084"

    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started

volumes:
  postgres_data: