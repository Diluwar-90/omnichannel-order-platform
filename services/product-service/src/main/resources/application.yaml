spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/omnichannel}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product_schema

  flyway:
    baseline-on-migrate: true
    default-schema: product_schema

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when_authorized

  info:
    env:
      enabled: true

info:
  app:
    name: product-service
    description: Product microservice for omnichannel order platform
    version: 1.0.0                                  