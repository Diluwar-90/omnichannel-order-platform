spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.diluwar.notification.event
        spring.json.value.default.type: com.diluwar.notification.event.PaymentCapturedEvent

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notification_db}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    schemas: notification_schema
    default-schema: notification_schema

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info