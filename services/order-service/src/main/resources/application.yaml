spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: order_schema

  flyway:
    baseline-on-migrate: true
    schemas: order_schema
    default-schema: order_schema

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info