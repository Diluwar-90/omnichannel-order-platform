spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: order-service
            uri: ${ORDER_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/orders/**

          - id: product-service
            uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/products/**

          - id: inventory-service
            uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/inventory/**

          - id: payment-service
            uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
            predicates:
              - Path=/api/v1/payments/**

          - id: notification-service
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
            predicates:
              - Path=/api/notifications/**

          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/auth/**


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG